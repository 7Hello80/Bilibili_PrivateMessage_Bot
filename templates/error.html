{% extends "base.html" %}

{% block title %}出错了 · B站私信机器人控制面板{% endblock %}

{% block content %}
<div class="error-shell">
    <section class="error-card">
        <div class="error-mark">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1>发生错误</h1>
        <p class="error-detail">{{ error }}</p>

        <div class="error-actions">
            <a class="btn btn-primary btn-block" href="/">
                <i class="fa-solid fa-house"></i><span>返回首页</span>
            </a>
            <button class="btn btn-secondary btn-block" type="button" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i><span>返回上页</span>
            </button>
        </div>

        <p class="error-foot">
            如果问题持续存在，请联系技术支持并提供上面的错误信息。
        </p>
    </section>
</div>
{% endblock %}
